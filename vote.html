<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【3C親子講座】即時互動文字雲</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #164e3d 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 22px;
      margin-top: 0;
      color: #a7f3d0;
      font-weight: 900;
    }

    .question-box {
      background: rgba(224, 86, 56, 0.2);
      border: 1px solid rgba(224, 86, 56, 0.5);
      border-radius: 16px;
      padding: 16px;
      margin: 20px 0;
      font-size: 16px;
      font-weight: 700;
      color: #ffe4e6;
      line-height: 1.5;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 14px;
      border: 2px solid #a7f3d0;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      font-weight: 700;
      outline: none;
      margin-bottom: 16px;
      text-align: center;
      font-family: inherit;
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      background: #e05638;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(224, 86, 56, 0.4);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .success-msg {
      display: none;
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid #10b981;
      color: #6ee7b7;
      padding: 14px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 700;
    }

    .recent-title {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 28px;
      margin-bottom: 10px;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-height: 140px;
      overflow-y: auto;
    }

    .tag-chip {
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📱 3C親子講座 • 現場即時互動</h1>
  
  <div class="question-box">
    ❓ 題目：當你叫孩子停止玩手機時，孩子最常講的回答是什麼？
  </div>

  <input type="text" id="user-input" placeholder="輸入孩子的常講金句 (例：再一下啦)" maxlength="25" />
  
  <button id="submit-btn" onclick="submitAnswer()">🚀 立即送出答案</button>

  <div id="success-toast" class="success-msg">
    ✅ 送出成功！講螢幕將即時呈現您的答案！
  </div>

  <div class="recent-title">🔥 現場最新投稿聲量（即時同步）：</div>
  <div id="recent-tags" class="recent-list">
    <span class="tag-chip">載入即時動態中...</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
  import {
    getFirestore, collection, addDoc, onSnapshot,
    serverTimestamp, query, orderBy, limit
  } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAYQhNavPSce17XtvDC5xnXyl9iUhW9KjA",
    authDomain: "teacherstudy-109ef.firebaseapp.com",
    projectId: "teacherstudy-109ef",
    storageBucket: "teacherstudy-109ef.firebasestorage.app",
    messagingSenderId: "196599230156",
    appId: "1:196599230156:web:cfe55d364df3ae1b9d5c69"
  };

  const app = initializeApp(firebaseConfig);
  const fdb = getFirestore(app);
  const wordsRef = collection(fdb, 'parenting_3c_wordcloud');

  window.submitAnswer = async function() {
    const input = document.getElementById('user-input');
    const word = input.value.trim();
    if (!word) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '傳送中...';

    try {
      await addDoc(wordsRef, {
        word: word,
        created_at: serverTimestamp()
      });

      input.value = '';
      const toast = document.getElementById('success-toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    } catch(e) {
      alert('傳送失敗，請再試一次');
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 立即送出答案';
    }
  };

  document.getElementById('user-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.submitAnswer();
  });

  // Real-time listener for recent submissions
  onSnapshot(query(wordsRef, orderBy('created_at', 'desc'), limit(15)), (snap) => {
    const listEl = document.getElementById('recent-tags');
    const items = [];
    snap.forEach(doc => {
      const w = doc.data().word;
      if (w) items.push(`<span class="tag-chip">${w}</span>`);
    });

    listEl.innerHTML = items.length ? items.join('') : '<span class="tag-chip">成為第一個輸入答案的人！</span>';
  });
</script>

</body>
</html>
