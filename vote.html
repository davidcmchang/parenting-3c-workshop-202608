<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>【3C親子講座】現場即時互動</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #164e3d 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      color: #a7f3d0;
      font-weight: 900;
    }

    .q-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 16px 0;
      background: rgba(0,0,0,0.25);
      padding: 6px;
      border-radius: 16px;
    }

    .q-tab {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 4px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .q-tab.active {
      background: #e05638;
      color: #ffffff;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(224, 86, 56, 0.4);
    }

    .question-box {
      background: rgba(224, 86, 56, 0.2);
      border: 1px solid rgba(224, 86, 56, 0.5);
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0 20px 0;
      font-size: 16px;
      font-weight: 700;
      color: #ffe4e6;
      line-height: 1.5;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Input: Standard half-width and full-width support */
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border-radius: 14px;
      border: 2px solid #a7f3d0;
      background: #ffffff;
      color: #0f172a;
      font-weight: 700;
      outline: none;
      margin-bottom: 16px;
      text-align: center;
      font-family: inherit;
      -webkit-appearance: none;
    }

    button.submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: #ffffff;
      background: #e05638;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(224, 86, 56, 0.4);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button.submit-btn:active {
      transform: scale(0.98);
    }

    .success-msg {
      display: none;
      background: rgba(16, 185, 129, 0.3);
      border: 1px solid #10b981;
      color: #a7f3d0;
      padding: 14px;
      border-radius: 12px;
      margin-top: 16px;
      font-weight: 700;
      font-size: 15px;
    }

    .recent-title {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 24px;
      margin-bottom: 10px;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-height: 140px;
      overflow-y: auto;
    }

    .tag-chip {
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📱 3C親子講座 • 現場即時互動</h1>
  
  <div class="q-tabs">
    <button class="q-tab active" id="tab-q1" onclick="switchQuestion('q1')">第 1 題</button>
    <button class="q-tab" id="tab-q2" onclick="switchQuestion('q2')">第 2 題</button>
    <button class="q-tab" id="tab-q3" onclick="switchQuestion('q3')">第 3 題</button>
    <button class="q-tab" id="tab-q4" onclick="switchQuestion('q4')">第 4 題</button>
  </div>

  <div class="question-box" id="question-text">
    ❓ 1. 你的孩子目前多大？ (幾歲／幾年級？)
  </div>

  <input type="text" id="user-input" placeholder="請輸入答案" maxlength="30" autocomplete="off" />
  
  <button class="submit-btn" id="submit-btn" onclick="submitAnswer()">🚀 立即送出答案</button>

  <div id="success-toast" class="success-msg">
    🎉 傳送成功！講桌大螢幕已即時呈現您的答案！
  </div>

  <div class="recent-title">🔥 現場最新投稿聲量：</div>
  <div id="recent-tags" class="recent-list">
    <span class="tag-chip">載入中...</span>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
  import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
  import { getFirestore, collection, addDoc } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAYQhNavPSce17XtvDC5xnXyl9iUhW9KjA",
    authDomain: "teacherstudy-109ef.firebaseapp.com",
    projectId: "teacherstudy-109ef",
    storageBucket: "teacherstudy-109ef.firebasestorage.app",
    messagingSenderId: "196599230156",
    appId: "1:196599230156:web:cfe55d364df3ae1b9d5c69"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const fdb = getFirestore(app);
  const wordsRef = collection(fdb, 'parenting_3c_wordcloud');
  const channel = new BroadcastChannel('parenting_3c_channel');

  const SHARED_BANK_ID = 'ff8081819f7e10ae019fcbd682546f73';
  const REST_API_URL = `https://api.restful-api.dev/objects/${SHARED_BANK_ID}`;

  const QUESTIONS = {
    q1: "1. 你的孩子目前多大？ (幾歲／幾年級？)",
    q2: "2. 你的孩子黏在網上，主要是在做甚麼？ (玩遊戲 / 看影音 / 社群媒體...)",
    q3: "3. 當你叫孩子停止玩手機時，最常聽到的下一句話是什麼？",
    q4: "4. 接著他(們)的回應，你最常回孩子是什麼？"
  };

  const PLACEHOLDERS = {
    q1: "例如：國小三年級、10歲",
    q2: "例如：打傳說、刷Shorts",
    q3: "例如：再一下啦！",
    q4: "例如：數到三、快關掉！"
  };

  let currentQ = 'q1';

  signInAnonymously(auth).catch(e => console.log('Auth:', e));

  window.switchQuestion = function(qId) {
    currentQ = qId;
    ['q1', 'q2', 'q3', 'q4'].forEach(id => {
      document.getElementById(`tab-${id}`).classList.toggle('active', id === qId);
    });
    document.getElementById('question-text').textContent = "❓ " + QUESTIONS[qId];
    document.getElementById('user-input').placeholder = PLACEHOLDERS[qId];
    fetchSharedWords();
  };

  function saveLocalWord(qId, word) {
    try {
      let store = JSON.parse(localStorage.getItem('parenting_3c_q_words') || '{}');
      if (!store[qId]) store[qId] = [];
      store[qId].push(word);
      localStorage.setItem('parenting_3c_q_words', JSON.stringify(store));
      channel.postMessage({ type: 'NEW_WORD', questionId: qId, word: word });
    } catch(e) {}
  }

  function getLocalWords(qId) {
    try {
      let store = JSON.parse(localStorage.getItem('parenting_3c_q_words') || '{}');
      return store[qId] || [];
    } catch(e) { return []; }
  }

  window.submitAnswer = async function() {
    const input = document.getElementById('user-input');
    const word = input.value.trim();
    if (!word) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = '傳送中...';

    saveLocalWord(currentQ, word);

    // Cross-Device REST API Sync
    try {
      let bank = { q1: [], q2: [], q3: [], q4: [] };
      let sessionStartTime = 0;
      try {
        let r = await fetch(REST_API_URL);
        if (r.ok) {
          let d = await r.json();
          bank = d?.data?.bank || bank;
          sessionStartTime = d?.data?.sessionStartTime || 0;
        }
      } catch(err) {}

      if (!bank[currentQ]) bank[currentQ] = [];
      bank[currentQ].push(word);
      bank[currentQ] = bank[currentQ].slice(-100);

      await fetch(REST_API_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: 'parenting_3c_wordbank',
          data: { bank: bank, sessionStartTime: sessionStartTime }
        })
      });
    } catch(err) {
      console.log('REST error:', err);
    }

    // Firebase Firestore Sync
    try {
      await addDoc(wordsRef, {
        questionId: currentQ,
        word: word,
        created_at: new Date().toISOString()
      });
    } catch(e) {}

    input.value = '';
    const toast = document.getElementById('success-toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3500);

    btn.disabled = false;
    btn.textContent = '🚀 立即送出答案';
    fetchSharedWords();
  };

  document.getElementById('user-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') window.submitAnswer();
  });

  async function fetchSharedWords() {
    let remoteWords = [];
    try {
      let r = await fetch(REST_API_URL);
      if (r.ok) {
        let d = await r.json();
        remoteWords = d?.data?.bank?.[currentQ] || [];
      }
    } catch(e) {}

    const local = getLocalWords(currentQ);
    const combined = [...remoteWords, ...local].reverse();
    const listEl = document.getElementById('recent-tags');
    const unique = [...new Set(combined)].slice(0, 14);
    
    listEl.innerHTML = unique.length 
      ? unique.map(w => `<span class="tag-chip">${w}</span>`).join('') 
      : '<span class="tag-chip">成為第一個回答此題的人！</span>';
  }

  channel.onmessage = (event) => {
    if (event.data && event.data.type === 'RESET_WORDS') {
      try {
        let store = JSON.parse(localStorage.getItem('parenting_3c_q_words') || '{}');
        delete store[event.data.questionId];
        localStorage.setItem('parenting_3c_q_words', JSON.stringify(store));
      } catch(e) {}
      fetchSharedWords();
    }
  };

  setInterval(fetchSharedWords, 2500);
  fetchSharedWords();
</script>

</body>
</html>
